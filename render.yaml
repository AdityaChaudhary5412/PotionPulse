services:
  - type: web
    name: potionpulse-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT --workers 2
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: CORS_ORIGINS
        value: "*"
      # For SQLite on Render: leave DATABASE_URL unset (defaults to sqlite:///./potion_pulse.db)
      # Or attach Render Postgres and Render automatically populates DATABASE_URL!

